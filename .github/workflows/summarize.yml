name: RSS論文サマライザー

on:
  schedule:
    # 毎日朝7時（JST）に実行 (UTC 22:00 = JST 7:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行も可能にする

jobs:
  summarize:
    if: ${{ false }} # 2025-xx-xx temporarily disabled per request
    runs-on: ubuntu-latest
    
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pythonセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: uvのインストール
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: 依存関係インストール
      run: |
        uv venv
        source .venv/bin/activate
        uv pip install -r requirements.txt
    
    - name: 論文サマライズ実行
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        source .venv/bin/activate
        python src/main.py --debug
    
    - name: データファイルの変更をコミット
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add data/last_check.json data/queue.json data/last_refilter.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update checkpoint and queue data [skip ci]" && git push)
